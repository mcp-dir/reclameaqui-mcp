# Smithery configuration for Reclame Aqui
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_reclameaqui

name: reclameaqui-mcp
displayName: "Reclame Aqui"
description: >
  Gerencie as reclamações da sua empresa no Reclame Aqui pela conta da Área da Empresa. Você informa o usuário e a senha da empresa e a plataforma entra na sua conta para listar reclamações, ler o detalhe, ver a reputação e responder os consumidores. Não usa a RA API paga, usa a mesma área que você já acessa no site.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/reclameaqui-mcp
repository: https://github.com/mcp-dir/reclameaqui-mcp

tags:
  - reclameaqui
  - brazil
  - ops
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_reclameaqui

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_reclameaqui/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
